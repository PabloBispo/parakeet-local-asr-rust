# release.yml — cut a release by pushing a tag: git tag vX.Y.Z && git push --tags
#
# Each binary is built natively on its own runner (no cross-compilation).
# ONNX Runtime is statically linked, so each artifact is fully self-contained.
# ffmpeg is a runtime dependency that end-users install separately.
#
# Artifacts produced per release:
#   parakeet-local-asr-rust-aarch64-apple-darwin.tar.gz
#   parakeet-local-asr-rust-x86_64-unknown-linux-gnu.tar.gz
#   parakeet-local-asr-rust-aarch64-unknown-linux-gnu.tar.gz
#   parakeet-local-asr-rust-x86_64-pc-windows-msvc.zip
#   SHA256SUMS

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Build matrix — one native job per target
  # ---------------------------------------------------------------------------
  build:
    name: Build · ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            archive: parakeet-local-asr-rust-aarch64-apple-darwin.tar.gz

          # Intel macOS (x86_64-apple-darwin) is intentionally NOT shipped: the
          # only GitHub Intel-mac runner (macos-13) is being retired and queues
          # for very long, and the audience is a shrinking minority with no GPU
          # benefit here. Intel-mac users build from source (see README) or use
          # Docker. Apple Silicon is covered by the aarch64 build above.

          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: parakeet-local-asr-rust-x86_64-unknown-linux-gnu.tar.gz

          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: parakeet-local-asr-rust-aarch64-unknown-linux-gnu.tar.gz

          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: parakeet-local-asr-rust-x86_64-pc-windows-msvc.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable, ${{ matrix.target }})
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          # Disable the default --deny warnings override so CI doesn't break
          # on upstream deprecation warnings outside our control.
          rustflags: ""

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # ---- Unix packaging (tar.gz) ----------------------------------------
      - name: Package (Unix tar.gz)
        if: runner.os != 'Windows'
        run: |
          tar czf "${{ matrix.archive }}" \
            -C "target/${{ matrix.target }}/release" \
            parakeet-local-asr-rust

      # ---- Windows packaging (zip) ----------------------------------------
      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "target\${{ matrix.target }}\release\parakeet-local-asr-rust.exe" `
            -DestinationPath "${{ matrix.archive }}"

      # ---- Checksum (per-job, one line) ------------------------------------
      - name: Compute SHA256 (Unix)
        if: runner.os != 'Windows'
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
          else
            shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
          fi
          cat "${{ matrix.archive }}.sha256"

      - name: Compute SHA256 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash "${{ matrix.archive }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.archive }}" | Out-File -Encoding ascii "${{ matrix.archive }}.sha256"
          Get-Content "${{ matrix.archive }}.sha256"

      # ---- Upload both files as a single artifact per matrix job ----------
      - name: Upload archive + checksum
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Publish — gather all artifacts, build SHA256SUMS, create GitHub Release
  # ---------------------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create/update releases and upload assets

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          # Downloads each artifact into a subdirectory named after the artifact.
          # We merge them all into the current directory in the next step.
          path: artifacts/

      - name: Collect archives and build SHA256SUMS
        run: |
          mkdir -p dist/

          # Flatten: move every archive and .sha256 sidecar into dist/
          find artifacts/ -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.sha256" \) \
            -exec mv {} dist/ \;

          # Concatenate all per-job checksum lines into a single SHA256SUMS file.
          # Each .sha256 file contains exactly one line: "<hash>  <filename>"
          cat dist/*.sha256 | sort > dist/SHA256SUMS

          echo "── dist/ contents ──"
          ls -lh dist/
          echo "── SHA256SUMS ──"
          cat dist/SHA256SUMS

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          # If triggered by workflow_dispatch (no tag), use a placeholder name.
          # Normal tag pushes populate github.ref_name automatically.
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
